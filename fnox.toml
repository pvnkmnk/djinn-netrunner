# Committed by design: this file holds ciphertext only. The identity that
# decrypts it is not in the repo.
#
# Run tasks that need these with `fnox exec -- mise run <task>`. mise's own
# [env] block deliberately holds no secret values, and `.env` stays gitignored
# and is materialised on demand, never committed.
#
# Deliberately absent:
#   * DATABASE_URL -- mode-dependent (a Postgres URL under compose, `netrunner.db`
#     for the single-binary dev server), so it belongs to the deploy path rather
#     than to a secret store that would silently pick one.
#   * SLSKD_USERNAME / SLSKD_PASSWORD -- the real Soulseek account, which no
#     generator can invent. Acquisition-only; everything else runs without it.

[providers.age]
type = "age"
recipients = ["age1846shjkjn76w4fy9azpq55jpfeu4un9jl7q4rj9a42fl37tpm3ss0j2c6y"]

[secrets]
JWT_SECRET= { provider = "age", value = "", description = "generated for the dev slice 2026-10-29" }
SUBSONIC_PASSWORD= { provider = "age", value = "", description = "generated for the dev slice 2026-10-29" }
SLSKD_API_KEY= { provider = "age", value = "", description = "generated for the dev slice 2026-10-29" }
POSTGRES_PASSWORD= { provider = "age", value = "", description = "generated for the dev slice 2026-10-29" }
