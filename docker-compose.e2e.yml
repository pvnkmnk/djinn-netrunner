# E2E overlay.
#
# Two identities are pinned here, both for the same reason: this stack must never
# be able to reach the beta deployment on the same machine.
#
# * `name:` sets the compose project. Without it the project defaults to the
#   checkout directory, so the suite shared the beta stack's named volumes:
#   `down -v` would delete the beta library, and ops-web authenticated against a
#   database whose stored role password predated .env.e2e, which crash-looped it
#   on 'password authentication failed for user musicops'.
# * `container_name` is overridden for every service the base file names, because
#   container names are global. Sharing them meant the e2e stack could only start
#   after the beta stack's containers were gone, and left containers mislabelled
#   between projects when it did not.
#
# The suite's own `docker exec` targets follow these names (see
# e2e/fixtures/auth.fixture.ts). Port 8080 is still shared with the beta stack;
# only one of the two can be up, which is why the acceptance docs stop the beta
# stack before running the suite.
name: netrunner-e2e

services:
  postgres:
    container_name: e2e-postgres
    ports: !reset []

  slskd:
    container_name: e2e-slskd

  volume-init:
    container_name: e2e-volume-init

  caddy:
    container_name: e2e-caddy

  ops-web:
    container_name: e2e-ops-web
    ports:
      - "8080:8080"
    environment:
      # E2E tests make many auth requests; higher limit for testing
      AUTH_RATE_LIMIT_MAX: 1000
      # Use test database for E2E tests. The password is interpolated from
      # POSTGRES_PASSWORD (.env.e2e) rather than hardcoded: the postgres service
      # gets its role password from that same variable, so a literal here meant
      # the two could disagree and ops-web failed auth against a stack that
      # otherwise looked healthy.
      DATABASE_URL: postgresql://musicops:${POSTGRES_PASSWORD}@postgres:5432/musicops_test?sslmode=disable
      # Enable Subsonic API for E2E tests
      SUBSONIC_ENABLED: "true"
      # Enable E2E test helper API (create-dir, etc.)
      E2E_ENABLE_TEST_API: "true"
      # Pinned so a developer's local `.env` (picked up by the base compose's
      # `env_file`) cannot put the e2e stack into production mode, where a
      # missing JWT_SECRET or Subsonic password refuses to boot. The suite must
      # behave identically in CI, where no `.env` exists at all.
      ENVIRONMENT: development
      CONFIG_ENV: development

  # The same validating egress boundary as the beta overlay, under the e2e
  # naming rules. This overlay merges with the BASE compose, not the beta one,
  # so the service is defined here in full rather than overridden. The static
  # deny list already covers RFC1918 (the compose network's own ranges
  # included); only yt-dlp is routed, so the stack's internal traffic
  # (postgres, slskd) is unaffected. The public-internet allowlist keeps the
  # refusal probe honest: a disallowed hop is denied by the boundary, not by
  # an offline stack.
  egress-proxy:
    image: ubuntu/squid:latest
    container_name: e2e-egress-proxy
    volumes:
      - ./ops/squid/squid.conf:/etc/squid/squid.conf:ro
      - ./ops/squid/allowed-domains.txt:/etc/squid/allowed-domains.txt:ro
    # Same pin as ops-worker: squid must resolve the probe's name to the same
    # documentation address the worker's guard checked, or CONNECT would
    # target a different host than the one that was validated (and would
    # otherwise fail — squid has no other way to learn this name). Paired
    # with hosts_file in squid.conf, which points squid's resolver at
    # /etc/hosts.
    extra_hosts:
      - "audio-probe.e2e.test=2001:db8:aa::10"
    # The proxy joins the doc network too: it is the one that dials the probe
    # on yt-dlp's behalf (the worker only talks to squid).
    networks:
      - default
      - probe-doc-v6
    healthcheck:
      test: ["CMD-SHELL", "bash -c '< /dev/tcp/127.0.0.1/3128'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  ops-worker:
    container_name: e2e-ops-worker
    environment:
      # The worker claims acquisition jobs from the same test DB ops-web
      # migrated (base file points it at `musicops`, which nothing here
      # creates).
      DATABASE_URL: postgresql://musicops:${POSTGRES_PASSWORD}@postgres:5432/musicops_test?sslmode=disable
      # yt-dlp egress goes through the validating proxy (DJI-501); only the
      # downloader is routed, so the app's own traffic to postgres/slskd is
      # unaffected.
      YTDLP_PROXY: http://egress-proxy:3128
    depends_on:
      egress-proxy:
        condition: service_healthy
      audio-probe:
        condition: service_healthy
    # The wrong-work refusal probe (see audio-probe below). /etc/hosts pins the
    # probe's name to ONE address — the documentation-IPv6 one — in the
    # resolver of every component that must agree on it: the worker's SSRF
    # guard resolves via Go's resolver, which consults files first, and yt-dlp
    # (python) and squid resolve through getaddrinfo, same order. A compose
    # DNS alias cannot do this: every Docker network is dual-stack in practice
    # (a --ipv6 bridge still auto-assigns 172.x, verified), so an alias
    # resolves to a private v4 address the guard would refuse — and the probe
    # must pass the guard to reach the gate. 2001:db8:aa::/64 is RFC 3849
    # documentation space: not in the guard's privateCIDRs, not in the
    # proxy's deny ACL, and unreachable from the internet.
    extra_hosts:
      - "audio-probe.e2e.test=2001:db8:aa::10"
    networks:
      # Reach the probe server over the doc network (yt-dlp does the fetching).
      - default
      - probe-doc-v6  # Wrong-work refusal probe (the fallback-entrance clause the acceptance
  # record still lists as not driven live). A tiny HTTP server on the IPv6
  # documentation network (RFC 3849 — 2001:db8::/32 is guaranteed never
  # routable, so nothing here can touch the internet) serving a real FLAC
  # whose tags name a different work than the probe requests. The URL passes
  # the app's pre-handover guard (DJI-500 — the range is not in privateCIDRs)
  # and the proxy's deny list (DJI-501 — same reason), yt-dlp downloads it
  # THROUGH the proxy fine, and the identity gate (download_gate.go) is the
  # layer that must refuse it. Every earlier layer passing is what makes this
  # a proof of the gate and not of something in front of it.
  # Resolution: the probe name is pinned via extra_hosts on the containers
  # that resolve it (see ops-worker) — this service needs no DNS alias at all.
  # Static v6 address so the /etc/hosts entry and the server agree.
  audio-probe:
    build:
      context: ./ops/audio-probe
    container_name: e2e-audio-probe
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
    # Ready means the FLAC exists and httpd answers — the entrypoint generates
    # the file at start, and service_started alone would let the worker claim
    # the probe job mid-generation.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/wrong-work.flac"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      probe-doc-v6:
        ipv6_address: 2001:db8:aa::10

networks:
  probe-doc-v6:
    # IPv6 documentation range (RFC 3849). Containers reach it; the internet
    # cannot, and it cannot reach out — 2001:db8::/32 is not globally routed.
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 2001:db8:aa::/64


