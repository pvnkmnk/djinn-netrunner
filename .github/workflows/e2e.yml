name: E2E Tests

# The default branch here is `master`. This workflow previously watched
# [main, develop] — neither exists in this repo, and the other workflows all
# watch [master, main] — so it never ran once. "All checks green" said nothing
# at all about the browser flows.
#
# It now gates pull_request, path-filtered. It did not, and the cost of that
# was concrete rather than theoretical: PR #346 merged green on seven checks
# and its Playwright spec failed on master the moment e2e.yml finally fired,
# because nothing had ever run a browser against that code before the merge.
# "All checks green" said nothing about the browser flows, which is the one
# thing a green PR is supposed to mean.
#
# The filter is not a speed trick. `backend/**` means this fires on nearly
# every PR in a repo that is mostly backend, and that is the honest price of a
# real gate: a few minutes of runner time against a 13-minute local suite.
# `ops/**` MUST be in the list -- the templates live in ops/web/templates, and
# dropping it to save minutes is precisely what let #346 through. The single
# `!` negation earns its keep: ops/ and e2e/ both carry markdown (codemap.md,
# runbooks) that cannot change a rendered page.
#
# Known limits of a path-filtered gate, both from GitHub rather than from us:
#
#   * GitHub evaluates at most the first 300 changed files against a path
#     filter. A PR larger than that whose matching paths sort late starts no
#     run at all. The remedy is to drop the filter and gate inside the job.
#   * A PR touching only excluded paths starts no workflow, so a *required*
#     check of this name would sit pending forever. The remedy is a second,
#     always-running workflow that reports success when this one is skipped --
#     deliberately NOT added yet, because no branch protection requires the
#     check today, so nothing can hang. Add it in the same change that makes
#     the check required.
on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    paths:
      - "backend/**"
      - "e2e/**"
      - "ops/**"
      - "scripts/**"
      - "docker-compose.yml"
      - "docker-compose.e2e.yml"
      - ".env.e2e.example"
      - ".github/workflows/e2e.yml"
      - "!**/*.md"

# Five pushes to one branch used to queue five full suites, and the last one
# landed an hour after anyone cared about it.
#
# Note what this workflow does NOT do: it cannot make itself required. As of
# this commit master has no branch protection and the repo has no rulesets, so
# a failing E2E run is visible but does not block a merge. Making the check
# required is a repository setting, not a workflow change, and it affects how
# humans merge too -- so it is raised rather than assumed.
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Playwright retries and takes a trace on the first retry; `true` also
      # makes its globalTeardown run `down -v`.
      CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Invoked through `bash` rather than the shebang so a checkout that lost
      # the executable bit still runs. The script materialises `.env.e2e` from
      # the checked-in template and installs Chromium; the stack itself is
      # started by Playwright's webServer (e2e/setup-test-db.sh), so there is
      # no separate bring-up step to drift out of sync with local runs.
      - name: Run E2E suite
        run: bash scripts/e2e.sh test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: e2e/test-results/
          retention-days: 7

      # The per-shard logs are what the completeness gate reasons about. If a
      # worker dies mid-run this is the artifact that says so, and it must not
      # live under test-results/ -- Playwright clears that directory itself.
      - name: Upload shard logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shard-logs
          path: e2e/shard-logs/
          retention-days: 14

      # A failed spec and a wedged stack look identical from the report alone.
      - name: Dump stack logs on failure
        if: failure()
        run: |
          docker compose --env-file .env.e2e -f docker-compose.yml -f docker-compose.e2e.yml logs --tail=100

      - name: Stop Docker stack
        if: always()
        run: bash scripts/e2e.sh down
