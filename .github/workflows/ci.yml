name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'

      - name: Download dependencies
        working-directory: backend
        run: go mod download

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Test
        working-directory: backend
        run: go test $(go list ./... | grep -v /integration/) -coverprofile=coverage.out
        env:
          CGO_ENABLED: 0

      # The e2e suite's completeness gate decides whether a run counts as
      # having covered everything, so the gate itself needs a test that runs on
      # every PR -- otherwise a change to count_category() could break it
      # silently and the suite would start reporting fewer tests than it runs.
      # Pure bash + sed/awk, no dependencies, ~0.03s. Five of its eight cases
      # are rejections, including a dead worker's "did not run" and a silent
      # truncation with no crash banner.
      - name: E2E completeness gate tests
        run: bash scripts/test_e2e_gate.sh

      # The Postgres gate (see the `postgres` job) is the only thing standing
      # between a skipped advisory-lock or wakeup test and a green tick, so the
      # gate's own rules are tested on every PR too. Offline: no database, no
      # `go test` -- crafted `go test -json` fixtures and the refusal paths.
      # ~0.05s, 23 cases, and eleven of them are rejections.
      - name: Postgres gate tests
        run: python scripts/test_postgres_gate.py

      # The password policy is one function called from three routes, and a
      # suite that only tests the function cannot see a route that stops asking
      # it -- the failure mode a shared helper invites. Four of the eight
      # mutations remove a CALL SITE for exactly that reason.
      #
      # Runs from the repo root so the script can locate backend/ from its own
      # path. ~40s: eight mutations plus two controls, each a scoped `go test`.
      # Exits non-zero if any mutant is MISSED or if either control fails, so a
      # green tick here means the mutants were caught, not merely that the
      # script exited zero -- the per-mutation table is in the step log.
      - name: Password policy mutation proof (Go-level)
        run: python scripts/password_policy_mutation_check.py

      # Same four rules, two promises. M1 removes the enqueue from
      # AddMonitoredArtist -- the DJI-588 defect itself -- and M2..M8 break one
      # clause each: the job's type and scope, the one-scan-per-artist rule, the
      # rollback that stops an unscanned artist surviving, the tracked-release
      # delete that keeps a scanned artist removable, and the template button
      # that was throwing the server's answer away. M9 and M10 hold the second
      # promise, which is that the CSP we serve still admits what the templates
      # need: M9 puts an eval-dependent values expression back on the candidate
      # row (the shipped defect -- htmx compiles it with eval, script-src
      # 'self' forbids that, and the click silently made no request), M10 is the
      # wrong fix applied to the header instead. ~50s: ten mutations plus two
      # controls, each a scoped `go test`. Exits non-zero on any MISSED or any
      # failed control; the per-mutation table is in this step's log.
      - name: Artist scan mutation proof (Go-level)
        run: python scripts/artist_scan_mutation_check.py

      - name: Vulnerability scan
        working-directory: backend
        env:
          # Pinned, not @latest, and this is what it cost to learn: jumping
          # the pin past what the runner's Go satisfies made govulncheck
          # fetch an unpublished toolchain and die as a phantom scan
          # (nothing scanned, exit 1, "404 Not Found" from sum.golang.org).
          # x/vuln v1.8.0 declares go 1.26.0 and the go-version pin above is
          # 1.27.2, so v1.8.0 is the newest release the pin satisfies. Bump
          # the two together, and check a release's go directive before
          # bumping it (curl proxy.golang.org/.../@v/vX.Y.Z.mod).
          #
          # The PATCH level matters as much as the minor: the go-version pin
          # must be >= the newest "Fixed in: go1.x.y" that govulncheck reports
          # for the standard library, or the scan fails on findings the
          # toolchain itself carries. On 1.27.0 it reported 11 stdlib findings
          # whose fix is go1.27.2 (net/http, net/http/internal/http2,
          # html/template, crypto/tls, net/textproto); 1.27.2 clears them.
          GOTOOLCHAIN: local
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage.out

  # ADR 0004: a green SQLite-only run is not evidence for a change that touches
  # claims, locks, wakeups or aggregate SQL. Every test that would prove those
  # paths calls t.Skip when DATABASE_URL is absent -- 16 of them in
  # internal/database alone -- and a skip is not a pass, so the `test` job above
  # cannot see a regression in any of them. This job hands them a real Postgres
  # and gates on them having RUN: scripts/postgres_gate.py refuses a run where a
  # required test skipped, disappeared, or failed.
  #
  # The database is a throwaway service container behind a throwaway password --
  # there is no secret here, and the tests create and drop their own schema
  # (TestMigrate_Postgres primes it through the production migrator).
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: netrunner_gate
          POSTGRES_USER: netrunner
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        # No hand-rolled wait loop: pg_isready is what the compose files use,
        # and GitHub holds the job until the container reports healthy.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://netrunner:testpass@127.0.0.1:5432/netrunner_gate?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'

      - name: Download dependencies
        working-directory: backend
        run: go mod download

      - name: Postgres gate (claims, locks, wakeups, aggregate SQL)
        env:
          CGO_ENABLED: 0
        run: python scripts/postgres_gate.py

  # lint job disabled until golangci-lint supports go1.25
