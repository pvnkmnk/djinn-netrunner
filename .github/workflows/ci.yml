name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'

      - name: Download dependencies
        working-directory: backend
        run: go mod download

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Test
        working-directory: backend
        run: go test $(go list ./... | grep -v /integration/) -coverprofile=coverage.out
        env:
          CGO_ENABLED: 0

      # The e2e suite's completeness gate decides whether a run counts as
      # having covered everything, so the gate itself needs a test that runs on
      # every PR -- otherwise a change to count_category() could break it
      # silently and the suite would start reporting fewer tests than it runs.
      # Pure bash + sed/awk, no dependencies, ~0.03s. Five of its eight cases
      # are rejections, including a dead worker's "did not run" and a silent
      # truncation with no crash banner.
      - name: E2E completeness gate tests
        run: bash scripts/test_e2e_gate.sh

      - name: Vulnerability scan
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage.out

  # lint job disabled until golangci-lint supports go1.25
