name: Docker

on:
  push:
    branches: [master, main]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The version rule has one owner: scripts/version.sh, which this workflow
      # and scripts/deploy.sh both call. So the version stamped into a published
      # image and the version a local bring-up builds cannot drift apart, and
      # neither can the constraint on them — the Docker-tag check applies to
      # both, where a ref like `release/1.0.0` would otherwise publish a footer
      # claiming a name that is not a release. The tag being published is the
      # version; any other ref passes the deliberate `dev` sentinel, so an image
      # pushed from a branch cannot advertise a release it is not.
      - name: Resolve APP_VERSION
        id: version
        run: |
          ref="dev"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then ref="${GITHUB_REF_NAME}"; fi
          version="$(bash scripts/version.sh "$ref")"
          echo "value=${version}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
