openapi: 3.0.3
info:
  title: NETRUNNER management API
  version: 1.0.0
  description: >-
    The additive, session-authenticated management contract for an existing
    NETRUNNER appliance. Subsonic/OpenSubsonic /rest endpoints are a separate
    protocol surface and are specified by docs/OPENSUBSONIC_COVERAGE.md. Its
    supported authentication modes are exactly account password (u+p) or
    configured shared token (u+t+s, double-MD5); conflicts, malformed or
    disabled credentials return the HTTP-200 Subsonic code-40 envelope. The
    management SLSKD_API_KEY is not a Subsonic credential and is never exposed.
servers:
  - url: /
tags:
  - name: health
  - name: authentication
  - name: playlists
  - name: jobs
  - name: acquisition
paths:
  /api/health:
    get:
      tags: [health]
      summary: Check server and configured dependency health
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Database is healthy; optional checks may be degraded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Database health is degraded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/auth/register:
    post:
      tags: [authentication]
      summary: Register an account and establish a session
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created and session cookie issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/auth/login:
    post:
      tags: [authentication]
      summary: Authenticate an account and establish a session
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session created and session_id cookie issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/logout:
    post:
      tags: [authentication]
      summary: End the current session
      operationId: logout
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Session ended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/me:
    get:
      tags: [authentication]
      summary: Return the authenticated management principal
      operationId: getCurrentPrincipal
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Identity and server-enforced session expiry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/playlists:
    get:
      tags: [playlists]
      summary: List playlists visible to the authenticated user
      operationId: listPlaylists
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Playlist resources, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Playlist'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [playlists]
      summary: Create a playlist
      operationId: createPlaylist
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaylistCreateRequest'
      responses:
        '201':
          description: Playlist created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/playlists/{id}:
    parameters:
      - $ref: '#/components/parameters/UUIDPath'
    get:
      tags: [playlists]
      summary: Read a playlist and its ordered tracks
      operationId: getPlaylist
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Playlist and ordered track collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [playlists]
      summary: Update playlist metadata
      operationId: updatePlaylist
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaylistUpdateRequest'
      responses:
        '200':
          description: Updated playlist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [playlists]
      summary: Delete a playlist
      operationId: deletePlaylist
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Playlist deleted.
        '404':
          $ref: '#/components/responses/NotFound'
  /api/jobs/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/IntegerPath'
    post:
      tags: [jobs]
      summary: Cancel a queued or running job
      operationId: cancelJob
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Job cancellation accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobActionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/jobs/{id}/retry:
    parameters:
      - $ref: '#/components/parameters/IntegerPath'
    post:
      tags: [jobs]
      summary: Re-queue a failed job
      operationId: retryJob
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Job retry accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobActionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/acquire:
    post:
      tags: [acquisition]
      summary: Queue an acquisition request
      operationId: enqueueAcquisition
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcquireRequest'
      responses:
        '201':
          description: Acquisition job queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcquireResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session_id
  parameters:
    UUIDPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IntegerPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    BadRequest:
      description: Invalid input or route identifier.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: No valid session was supplied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The session is authenticated but lacks permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The resource does not exist or is outside the caller's scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Stable, user-safe error message.
        code:
          type: string
          description: Optional machine-readable error code; additive in v1.
        details:
          type: object
          additionalProperties: true
          description: Optional field-level validation details.
        request_id:
          type: string
          description: Optional correlation identifier.
    StatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, created, updated, deleted]
    AuthMeResponse:
      type: object
      required: [id, email, role, expires_at]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        role:
          type: string
          enum: [user, admin]
        expires_at:
          type: string
          format: date-time
    HealthCheck:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, error]
        message:
          type: string
        error:
          type: string
    HealthResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/HealthCheck'
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          writeOnly: true
        enrollment_code:
          type: string
          writeOnly: true
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          writeOnly: true
    Playlist:
      type: object
      required: [ID, Name, Description, Public]
      properties:
        ID:
          type: string
          format: uuid
        Name:
          type: string
        Description:
          type: string
        Public:
          type: boolean
        OwnerUserID:
          type: integer
          format: int64
          nullable: true
        CreatedAt:
          type: string
          format: date-time
    Pagination:
      type: object
      required: [page, limit]
      properties:
        page:
          type: integer
          minimum: 1
          default: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
        UpdatedAt:
          type: string
          format: date-time
    PlaylistCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        public:
          type: boolean
          default: false
    PlaylistUpdateRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        public:
          type: boolean
    PlaylistDetail:
      type: object
      required: [playlist, tracks]
      properties:
        playlist:
          $ref: '#/components/schemas/Playlist'
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/Track'
    Track:
      type: object
      properties:
        ID:
          type: string
          format: uuid
        Title:
          type: string
        Artist:
          type: string
        Album:
          type: string
        Path:
          type: string
        Format:
          type: string
    JobActionResponse:
      type: object
      required: [status, job_id]
      properties:
        status:
          type: string
          enum: [cancelled, retry_queued]
        job_id:
          type: integer
          format: int64
    AcquireRequest:
      type: object
      required: [artist]
      properties:
        artist:
          type: string
          minLength: 1
        album:
          type: string
        title:
          type: string
        quality_profile_id:
          type: string
          format: uuid
    AcquireResponse:
      type: object
      required: [status, job_id]
      properties:
        status:
          type: string
          enum: [queued]
        job_id:
          type: integer
          format: int64
