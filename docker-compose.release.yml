# NetRunner release deployment overlay.
#
#   cp .env.release.example .env     # then set the required values
#   ./scripts/deploy.sh --release    # derives APP_VERSION from the git tag
#
# The canonical release path is the base docker-compose.yml — which is the dev
# path on its own — plus this overlay. What this adds:
#   * production semantics (ENVIRONMENT/CONFIG_ENV), pinned so a stray .env
#     cannot silently turn a release into a development stack, and the
#     Subsonic streaming endpoint enabled so a music client can actually play.
#   * restart policies and bounded container logs.
#   * a validating egress sidecar for yt-dlp (the egress-proxy service).
#   * an optional Navidrome (`--profile media-server`) for deployments that want
#     an external Subsonic server in front of the same music volume.
#
# The app fails fast when a required production setting is missing
# (JWT_SECRET, and SUBSONIC_PASSWORD when Subsonic is enabled), so a
# misconfigured release exits with a readable error instead of degrading.
# See docs/DEPLOYMENT.md.

x-release-logging: &release-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  ops-web:
    environment:
      # Pinned, not ${ENVIRONMENT:-production}: the deploy path decides the
      # mode, so nothing in .env can quietly turn a release into a dev stack.
      ENVIRONMENT: production
      CONFIG_ENV: production
      SUBSONIC_ENABLED: ${SUBSONIC_ENABLED:-true}
    restart: unless-stopped
    logging: *release-logging

  # Validating egress boundary for yt-dlp (DJI-501). The downloader follows its
  # own redirects after the app's pre-flight check hands the URL over; this
  # sidecar denies private/loopback/link-local ranges at connect time, so a hop
  # to an internal address fails inside yt-dlp instead of being contacted.
  # No ports are published (compose-network-only) and the destination allowlist
  # in ops/squid/ constrains what it will fetch. To bypass the boundary, set
  # YTDLP_PROXY= in .env -- not recommended; the sidecar is the point of the
  # overlay.
  egress-proxy:
    image: ubuntu/squid:latest
    container_name: netrunner-egress-proxy
    volumes:
      - ./ops/squid/squid.conf:/etc/squid/squid.conf:ro
      - ./ops/squid/allowed-domains.txt:/etc/squid/allowed-domains.txt:ro
    # Readiness, not just start: a worker claiming a job before squid accepts
    # connections would burn a retry attempt on a proxy-connect error.
    healthcheck:
      test: ["CMD-SHELL", "bash -c '< /dev/tcp/127.0.0.1/3128'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    logging: *release-logging

  ops-worker:
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CONFIG_ENV: ${CONFIG_ENV:-production}
      # No-colon ${VAR-default}: unset picks the sidecar, an explicit empty
      # value means direct egress. Only yt-dlp is routed; the app's own
      # traffic (postgres, slskd, providers) is unaffected.
      YTDLP_PROXY: ${YTDLP_PROXY-http://egress-proxy:3128}
    depends_on:
      egress-proxy:
        condition: service_healthy
    restart: unless-stopped
    logging: *release-logging

  postgres:
    restart: unless-stopped
    logging: *release-logging

  slskd:
    restart: unless-stopped
    logging: *release-logging

  # Optional external Subsonic server over the same music volume.
  # Enable with `--profile media-server` and set NAVIDROME_URL in .env so the
  # worker triggers rescans and dedup checks against it.
  navidrome:
    image: deluan/navidrome:latest
    container_name: netrunner-navidrome
    profiles: ["media-server"]
    environment:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_PORT: "4533"
      # The image's dev bootstrap defaults to admin/admin. Requiring an explicit
      # password (empty disables the bootstrap) avoids shipping a media server
      # with credentials that are published in this repo.
      ND_DEVAUTOCREATEADMINUSER: ${NAVIDROME_ADMIN_USER:-}
      ND_DEVAUTOCREATEADMINPASSWORD: ${NAVIDROME_ADMIN_PASSWORD:-}
    volumes:
      - netrunner-music:/music:ro
      - netrunner-navidrome-data:/data
    ports:
      # Loopback for the same reason as ops-web: plain HTTP, real credentials.
      - "${NAVIDROME_BIND_ADDR:-127.0.0.1}:${NAVIDROME_PORT:-4533}:4533"
    depends_on:
      volume-init:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *release-logging

volumes:
  netrunner-navidrome-data:
