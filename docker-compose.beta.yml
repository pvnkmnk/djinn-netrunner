# NetRunner beta deployment overlay.
#
#   cp .env.beta.example .env      # then set the required values
#   docker compose -f docker-compose.yml -f docker-compose.beta.yml up -d --build
#
# What this adds on top of docker-compose.yml:
#   * ops-web published on ${BETA_HTTP_PORT:-8080}; Caddy moves behind the
#     `edge` profile so a local beta speaks plain HTTP instead of presenting a
#     local-CA certificate. Add `--profile edge` when you do want TLS on :443.
#   * production semantics (ENVIRONMENT/CONFIG_ENV) plus the Subsonic streaming
#     endpoint enabled, so a music client can actually play from NetRunner.
#   * restart policies and bounded container logs.
#   * an optional Navidrome (`--profile media-server`) for deployments that want
#     an external Subsonic server in front of the same music volume.
#
# The app now fails fast when a required production setting is missing
# (JWT_SECRET, and SUBSONIC_PASSWORD when Subsonic is enabled), so a
# misconfigured beta exits with a readable error instead of silently degrading.
# See docs/BETA_DEPLOYMENT.md.

x-beta-logging: &beta-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # TLS terminator from the base stack — opt in with `--profile edge`.
  caddy:
    profiles: ["edge"]

  ops-web:
    ports:
      # Loopback by default. This port speaks plain HTTP and carries session
      # cookies and Subsonic credentials, so publishing it on every interface
      # exposes them in cleartext. Reach it remotely through the `edge`
      # profile's Caddy, or set BETA_BIND_ADDR when a TLS terminator fronts it.
      - "${BETA_BIND_ADDR:-127.0.0.1}:${BETA_HTTP_PORT:-8080}:8080"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CONFIG_ENV: ${CONFIG_ENV:-production}
      SUBSONIC_ENABLED: ${SUBSONIC_ENABLED:-true}
    restart: unless-stopped
    logging: *beta-logging

  ops-worker:
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CONFIG_ENV: ${CONFIG_ENV:-production}
    restart: unless-stopped
    logging: *beta-logging

  postgres:
    restart: unless-stopped
    logging: *beta-logging

  slskd:
    restart: unless-stopped
    logging: *beta-logging

  # Optional external Subsonic server over the same music volume.
  # Enable with `--profile media-server` and set NAVIDROME_URL in .env so the
  # worker triggers rescans and dedup checks against it.
  navidrome:
    image: deluan/navidrome:latest
    container_name: netrunner-navidrome
    profiles: ["media-server"]
    environment:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_PORT: "4533"
      # The image's dev bootstrap defaults to admin/admin. Requiring an explicit
      # password (empty disables the bootstrap) avoids shipping a media server
      # with credentials that are published in this repo.
      ND_DEVAUTOCREATEADMINUSER: ${NAVIDROME_ADMIN_USER:-}
      ND_DEVAUTOCREATEADMINPASSWORD: ${NAVIDROME_ADMIN_PASSWORD:-}
    volumes:
      - netrunner-music:/music:ro
      - netrunner-navidrome-data:/data
    ports:
      # Loopback for the same reason as ops-web: plain HTTP, real credentials.
      - "${NAVIDROME_BIND_ADDR:-127.0.0.1}:${NAVIDROME_PORT:-4533}:4533"
    depends_on:
      volume-init:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *beta-logging

volumes:
  netrunner-navidrome-data:
