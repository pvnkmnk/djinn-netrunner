# === LiteFS / SQLite Deployment Profile ===
# By default this compose file uses PostgreSQL. For multi-worker SQLite
# deployments with LiteFS, uncomment the litefs service below, add the
# `sqlite` profile tag to ops-web and ops-worker, and change DATABASE_URL
# to use the LiteFS proxy endpoint.
#
# Scaling workers: docker compose up --scale ops-worker=3
# See docs/RUNBOOK.md#litefs-scaling for details.
#
# litefs:
#   image: flyio/litefs:latest
#   container_name: netrunner-litefs
#   volumes:
#     - ./ops/litefs/litefs.yml:/etc/litefs.yml:ro
#     - netrunner-litefs-data:/var/lib/litefs
#     - netrunner-sqlite-data:/litefs
#   cap_add:
#     - SYS_ADMIN
#   devices:
#     - /dev/fuse
#   security_opt:
#     - apparmor:unconfined
#   depends_on:
#     postgres:
#       condition: service_started
#   restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    container_name: netrunner-postgres
    environment:
      POSTGRES_DB: musicops
      POSTGRES_USER: musicops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - netrunner-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicops"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  slskd:
    image: slskd/slskd:latest
    container_name: netrunner-slskd
    # Run as UID/GID 1000 so downloaded files are owned by the same user the
    # netrunner worker runs as (Dockerfile creates netrunner with UID 1000).
    # Both containers share the netrunner-downloads volume; without this,
    # slskd writes root-owned downloads and the worker's post-import cleanup
    # fails with EACCES. Per slskd docs the user: key is the recommended
    # non-root method — the container never gains root privileges.
    user: "1000:1000"
    environment:
      SLSKD_SLSK_USERNAME: ${SLSKD_USERNAME}
      SLSKD_SLSK_PASSWORD: ${SLSKD_PASSWORD}
      SLSKD_REMOTE_CONFIGURATION: "true"
    volumes:
      - netrunner-slskd-data:/app
      - netrunner-downloads:/downloads
    depends_on:
      volume-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-shot bootstrap: named volumes initialize root-owned, and slskd's
  # entrypoint refuses to start (in user: mode) when /app is not writable by
  # UID 1000. Chown both slskd-shared volumes to 1000:1000 before anything
  # starts. Idempotent — a no-op once ownership is correct.
  volume-init:
    image: alpine:3
    container_name: netrunner-volume-init
    user: "0:0"
    command: ["sh", "-c", "chown -R 1000:1000 /slskd-data /downloads && echo 'volume-init: ownership OK'"]
    volumes:
      - netrunner-slskd-data:/slskd-data
      - netrunner-downloads:/downloads
    restart: "no"

  caddy:
    image: caddy:2-alpine
    container_name: netrunner-caddy
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - netrunner-caddy-data:/data
      - netrunner-caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      ops-web:
        condition: service_healthy
    restart: unless-stopped

  ops-web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ops-web
    command: ["./netrunner-server"]
    environment:
      DATABASE_URL: postgresql://musicops:${POSTGRES_PASSWORD}@postgres:5432/musicops?sslmode=disable
      SLSKD_URL: http://netrunner-slskd:5030
      SLSKD_API_KEY: ${SLSKD_API_KEY}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      PORT: "8080"
      STATIC_FILES_PATH: /app/static
      TEMPLATES_PATH: /app/templates
      DOWNLOAD_STAGING: /app/downloads
      MUSIC_LIBRARY: /app/music
    volumes:
      - netrunner-config:/app/config
      - netrunner-logs:/app/logs
      - netrunner-downloads:/app/downloads
      - netrunner-music:/app/music
    depends_on:
      volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      slskd:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
  ops-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ops-worker
    command: ["./netrunner-worker"]
    environment:
      DATABASE_URL: postgresql://musicops:${POSTGRES_PASSWORD}@postgres:5432/musicops?sslmode=disable
      SLSKD_URL: http://netrunner-slskd:5030
      SLSKD_API_KEY: ${SLSKD_API_KEY}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      MUSIC_LIBRARY: /app/music
      WORKER_ID: ${HOSTNAME:-ops-worker-1}
      WORKER_HEALTH_ADDR: ":9091"
    volumes:
      - netrunner-config:/app/config
      - netrunner-logs:/app/logs
      - netrunner-downloads:/app/downloads
      - netrunner-music:/app/music
    depends_on:
      volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      slskd:
        condition: service_started
    healthcheck:
      # /healthz verifies the database actually answers — a process-only
      # check stays green while the worker is wedged on a dead DB connection.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  netrunner-postgres-data:
  netrunner-slskd-data:
  netrunner-caddy-data:
  netrunner-caddy-config:
  netrunner-config:
  netrunner-logs:
  netrunner-downloads:
  netrunner-music:
