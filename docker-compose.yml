# === LiteFS / SQLite Deployment Profile ===
# By default this compose file uses PostgreSQL. For multi-worker SQLite
# deployments with LiteFS, uncomment the litefs service below, add the
# `sqlite` profile tag to ops-web and ops-worker, and change DATABASE_URL
# to use the LiteFS proxy endpoint.
#
# Scaling workers: docker compose up --scale ops-worker=3
# See docs/RUNBOOK.md#litefs-scaling for details.
#
# litefs:
#   image: flyio/litefs:latest
#   container_name: netrunner-litefs
#   volumes:
#     - ./ops/litefs/litefs.yml:/etc/litefs.yml:ro
#     - netrunner-litefs-data:/var/lib/litefs
#     - netrunner-sqlite-data:/litefs
#   cap_add:
#     - SYS_ADMIN
#   devices:
#     - /dev/fuse
#   security_opt:
#     - apparmor:unconfined
#   depends_on:
#     postgres:
#       condition: service_started
#   restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    container_name: netrunner-postgres
    environment:
      POSTGRES_DB: musicops
      POSTGRES_USER: musicops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - netrunner-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicops"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  slskd:
    image: slskd/slskd:latest
    container_name: netrunner-slskd
    # Run as UID/GID 1000 so downloaded files are owned by the same user the
    # netrunner worker runs as (Dockerfile creates netrunner with UID 1000).
    # Both containers share the netrunner-downloads volume; without this,
    # slskd writes root-owned downloads and the worker's post-import cleanup
    # fails with EACCES. Per slskd docs the user: key is the recommended
    # non-root method — the container never gains root privileges.
    user: "1000:1000"
    environment:
      SLSKD_SLSK_USERNAME: ${SLSKD_USERNAME}
      SLSKD_SLSK_PASSWORD: ${SLSKD_PASSWORD}
      SLSKD_REMOTE_CONFIGURATION: "true"
      # slskd defaults its downloads directory to ~/downloads, which resolves
      # to /app/downloads inside the container — that is the *slskd data*
      # volume, not the one the worker imports from. Without this, transfers
      # report "completed" while the shared volume stays empty and every import
      # fails with "Downloaded file not found". Point it at the shared volume,
      # which the app mounts as DOWNLOAD_STAGING (/app/downloads).
      # Incomplete files stay in slskd's own volume — only finished downloads
      # need to be visible to the worker.
      SLSKD_DOWNLOADS_DIR: /downloads
      # slskd must hold the same key the app sends as X-API-Key. Setting it
      # only on the app containers is the classic failure: every Soulseek
      # search returns 401 while slskd logs "Unknown API key beginning with".
      # This is slskd's *primary* key (-k/--api-key, SLSKD_API_KEY), which is
      # documented and stable — unlike the web.authentication.api_keys map,
      # whose environment-variable nesting is version-fragile. Must be 16-255
      # characters or slskd refuses to start.
      SLSKD_API_KEY: ${SLSKD_API_KEY}
    volumes:
      - netrunner-slskd-data:/app
      - netrunner-downloads:/downloads
    depends_on:
      volume-init:
        condition: service_completed_successfully
    # /health is up as soon as the HTTP API is listening — it does not depend on
    # the Soulseek login succeeding. Without this, an slskd that refuses to
    # start (e.g. an API key under 16 characters) looks the same as a healthy
    # one to `depends_on: service_started`.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5030/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # One-shot bootstrap: named volumes initialize root-owned, and slskd's
  # entrypoint refuses to start (in user: mode) when /app is not writable by
  # UID 1000. Chown both slskd-shared volumes to 1000:1000 before anything
  # starts. Idempotent — a no-op once ownership is correct.
  volume-init:
    image: alpine:3
    container_name: netrunner-volume-init
    user: "0:0"
    command: ["sh", "-c", "chown -R 1000:1000 /slskd-data /downloads && echo 'volume-init: ownership OK'"]
    volumes:
      - netrunner-slskd-data:/slskd-data
      - netrunner-downloads:/downloads
    restart: "no"

  caddy:
    image: caddy:2-alpine
    container_name: netrunner-caddy
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - netrunner-caddy-data:/data
      - netrunner-caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      ops-web:
        condition: service_healthy
    restart: unless-stopped

  ops-web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ops-web
    command: ["./netrunner-server"]
    # Inject .env into the container. Without this, .env is only used for
    # ${VAR} substitution *inside this file*: JWT_SECRET, CONFIG_ENV,
    # PROXY_URL, NAVIDROME_*, SUBSONIC_* and every provider key documented in
    # .env.example would never reach the process. `environment:` below still
    # wins over env_file, so the compose-derived values stay authoritative.
    # `required: false` keeps a fresh clone (no .env) startable.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://musicops:${POSTGRES_PASSWORD}@postgres:5432/musicops?sslmode=disable
      SLSKD_URL: http://netrunner-slskd:5030
      SLSKD_API_KEY: ${SLSKD_API_KEY}
      # slskd/Navidrome/Gonic are reached by their compose service name, which
      # resolves to a private IP — the SSRF guard rejects that by default, and
      # every Soulseek search would fail with `ssrf: no public IP found`. The
      # URLs here are operator-configured, not user input, so the inner-service
      # check is waived for this client. Provider APIs keep full SSRF protection.
      ALLOW_PRIVATE_TARGETS: "true"
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      PORT: "8080"
      STATIC_FILES_PATH: /app/static
      TEMPLATES_PATH: /app/templates
      DOWNLOAD_STAGING: /app/downloads
      MUSIC_LIBRARY: /app/music
    volumes:
      - netrunner-config:/app/config
      - netrunner-logs:/app/logs
      - netrunner-downloads:/app/downloads
      - netrunner-music:/app/music
    depends_on:
      volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      # service_healthy, not service_started: a misconfigured slskd exits at
      # startup, and starting anyway yields an app that 401s every search.
      slskd:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
  ops-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ops-worker
    command: ["./netrunner-worker"]
    # Same passthrough as ops-web: the worker is the process that actually needs
    # the provider keys, proxy and media-server credentials.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://musicops:${POSTGRES_PASSWORD}@postgres:5432/musicops?sslmode=disable
      SLSKD_URL: http://netrunner-slskd:5030
      SLSKD_API_KEY: ${SLSKD_API_KEY}
      # See the note on ops-web: the worker is the process that actually calls
      # slskd, so this is the one that breaks acquisition without it.
      ALLOW_PRIVATE_TARGETS: "true"
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      MUSIC_LIBRARY: /app/music
      WORKER_ID: ${HOSTNAME:-ops-worker-1}
      WORKER_HEALTH_ADDR: ":9091"
    volumes:
      - netrunner-config:/app/config
      - netrunner-logs:/app/logs
      - netrunner-downloads:/app/downloads
      - netrunner-music:/app/music
    depends_on:
      volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      # See the note on ops-web: wait for a genuinely healthy slskd, or the
      # worker burns its first acquisition jobs against a dead client.
      slskd:
        condition: service_healthy
    healthcheck:
      # /healthz verifies the database actually answers — a process-only
      # check stays green while the worker is wedged on a dead DB connection.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  netrunner-postgres-data:
  netrunner-slskd-data:
  netrunner-caddy-data:
  netrunner-caddy-config:
  netrunner-config:
  netrunner-logs:
  netrunner-downloads:
  netrunner-music:
