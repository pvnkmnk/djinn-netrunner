# Integration Testing Services for NetRunner
# This compose file sets up dockerized slskd for end-to-end testing

services:
  slskd-integration:
    image: slskd/slskd:latest
    container_name: netrunner-slskd-integration
    environment:
      # Test Soulseek credentials - these should be set via environment
      # For CI/testing, use placeholder or test account
      SLSKD_SLSK_USERNAME: ${SLSKD_TEST_USERNAME:-testuser}
      SLSKD_SLSK_PASSWORD: ${SLSKD_TEST_PASSWORD:-testpass}
      SLSKD_REMOTE_CONFIGURATION: "true"
      SLSKD_HTTP_PORT: 5030
      SLSKD_SLSK_PORT: 2234
      # Enable debug logging for integration tests
      SLSKD_DEBUG: "true"
      # Generate predictable API key for testing
      SLSKD_API_KEY: ${SLSKD_TEST_API_KEY:-test-api-key-for-integration}
      # Configure download paths for testing
      SLSKD_DOWNLOADS_DIR: /downloads
    volumes:
      - slskd-integration-data:/app
      - slskd-integration-downloads:/downloads
    ports:
      - "15030:5030"
      - "12234:2234"
    networks:
      - netrunner-integration
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5030/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # NetRunner app server under test. The smoke tests exercise the real HTTP
  # API (register/login/logout, libraries, jobs, webhooks, …) against this
  # instance on :8080. ALLOW_PRIVATE_TARGETS lets the app reach the slskd and
  # postgres containers on the docker network; CSRF_ENABLED=false lets the
  # tokenless smoke-test HTTP clients POST to auth endpoints.
  integration-app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: netrunner-integration-app
    command: ["./netrunner-server"]
    environment:
      DATABASE_URL: postgresql://testuser:${INTEGRATION_DB_PASSWORD:-testpass}@integration-db:5432/netrunner_integration?sslmode=disable
      SLSKD_URL: http://slskd-integration:5030
      SLSKD_API_KEY: ${SLSKD_TEST_API_KEY:-test-api-key-for-integration}
      NAVIDROME_URL: http://navidrome-integration:4533
      NAVIDROME_USER: admin
      NAVIDROME_PASS: ${NAVIDROME_TEST_PASSWORD:-integration-test-pass}
      JWT_SECRET: integration-test-secret
      MUSIC_LIBRARY: /app/music
      ALLOW_PRIVATE_TARGETS: "true"
      CSRF_ENABLED: "false"
      # High limit so the rate-limit smoke test doesn't starve other tests'
      # registrations; the limiter itself is exercised by its own test.
      AUTH_RATE_LIMIT_MAX: "200"
    depends_on:
      integration-db:
        condition: service_healthy
      slskd-integration:
        condition: service_healthy
      navidrome-integration:
        condition: service_healthy
    ports:
      - "18080:8080"
    networks:
      - netrunner-integration
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Media-library server under test (Subsonic-compatible, same family the
  # production stack runs). Seeded read-only with tiny committed fixtures so
  # dedup/search/scan integration tests exercise the real scan pipeline.
  # ND_DEVAUTOCREATEADMINPASSWORD creates the 'admin' user on first boot;
  # the credentials must match the app's NAVIDROME_* env below.
  navidrome-integration:
    image: deluan/navidrome:latest
    container_name: netrunner-navidrome-integration
    environment:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_DEVAUTOCREATEADMINPASSWORD: ${NAVIDROME_TEST_PASSWORD:-integration-test-pass}
      ND_ENABLEINSIGHTSCOLLECTOR: "false"
      ND_LOGLEVEL: "info"
    volumes:
      - ./backend/internal/integration/testdata/navidrome-seed:/music:ro
      - navidrome-integration-data:/data
    ports:
      - "14533:4533"
    networks:
      - netrunner-integration
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:4533/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Mock Soulseek peer for testing downloads
  # This is a placeholder - in real integration tests, you'd either:
  # 1. Use a real test Soulseek account with shared files
  # 2. Mock the Soulseek protocol (complex)
  # 3. Use a test network with known peers
  
  integration-db:
    image: postgres:16-alpine
    container_name: netrunner-integration-db
    environment:
      POSTGRES_DB: netrunner_integration
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: ${INTEGRATION_DB_PASSWORD:-testpass}
    volumes:
      - integration-db-data:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    networks:
      - netrunner-integration
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d netrunner_integration"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  slskd-integration-data:
  slskd-integration-downloads:
  integration-db-data:
  navidrome-integration-data:

networks:
  netrunner-integration:
    driver: bridge
