# Validating egress boundary in front of yt-dlp (DJI-501).
#
# The app's download guard validates a source URL and its redirect chain before
# handing it to the downloader (DJI-500). What no pre-flight check can see is
# the network activity yt-dlp performs after handover -- its own redirect hops
# among them. This proxy is the narrowest closure of that residual: yt-dlp is
# pointed here via --proxy (YTDLP_PROXY), so every hop it takes is subject to
# connect-time rules.
#
# Deny first: private, loopback, link-local, and unique-local ranges fail at
# connect time -- inside yt-dlp, visibly in its stderr -- instead of being
# contacted. This is the range set, not an environment-specific list: it
# covers every compose network by construction, in beta and e2e alike.
acl private_nets dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/3
http_access deny private_nets

# Then allow only what the extraction sites need: the public-internet
# destinations below, reached directly or over redirects. Anything not listed
# is refused -- the proxy is a boundary, not a general forward proxy.
acl allowed_domains dstdomain "/etc/squid/allowed-domains.txt"
http_access allow allowed_domains

# Everything else (including direct-IP forms like http://93.184.216.34/...,
# which dstdomain cannot match) is denied.
http_access deny all

# Resolve hostnames through /etc/hosts first (then DNS). The e2e overlay pins
# the wrong-work probe's name there via extra_hosts (see docker-compose.e2e.yml):
# CONNECT audio-probe.e2e.test must dial the same documentation-IPv6 address
# the worker's SSRF guard validated, not a different resolution of the name.
hosts_file /etc/hosts

# Never honoured: a proxy must not answer for the private ranges it denies.
http_port 3128

# Bounds commensurate with a downloader: bounded hop chain, bounded connect
# patience. NOTE on size: this proxy CANNOT bound download size — for the
# HTTPS CONNECT tunnels yt-dlp uses, squid only sees the tunnel, never the
# body, and maximum_object_size governs cache storage, which `cache deny all`
# disables anyway. Oversized-output protection lives in the import path's
# plausibility gate (download validation), not here.
connect_timeout 30 seconds
read_timeout 5 minutes
request_timeout 1 minute
client_idle_pconn_timeout 1 minute

# Logging to /var/log/squid (writable by the cache_effective_user 'proxy';
# /dev/stdout is root-owned in the container and squid drops privileges before
# opening its logs, which FATALs). Read access lines with:
#   docker exec <proxy-container> tail /var/log/squid/access.log
access_log stdio:/var/log/squid/access.log
cache_log stdio:/var/log/squid/cache.log
cache deny all
