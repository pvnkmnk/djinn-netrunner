<div class="schedule-card" id="schedule-{{ schedule.ID }}">
    <div class="schedule-info">
        <div class="name">
            {{ schedule.Watchlist.Name | escape }}
            {% if not schedule.Enabled %}<span class="badge badge-disabled">Disabled</span>{% endif %}
        </div>
        <div class="details">
            <span>Cron: {{ schedule.CronExpr | escape }}</span>
             <span>Next: {{ schedule.NextRunLabel }}</span>
        </div>
    </div>
    <div class="actions">
        <button class="btn btn-sm" hx-patch="/api/schedules/{{ schedule.ID }}/toggle" hx-target="#schedule-{{ schedule.ID }}" hx-swap="outerHTML" aria-label="{% if schedule.Enabled %}Disable{% else %}Enable{% endif %} schedule for {{ schedule.Watchlist.Name | escape }}">
            {% if schedule.Enabled %}Disable{% else %}Enable{% endif %}
        </button>
        <button class="btn btn-sm" hx-get="/api/schedules/form?id={{ schedule.ID }}" hx-target="#modal-container" hx-swap="innerHTML" aria-label="Edit schedule for {{ schedule.Watchlist.Name | escape }}">
            Edit
        </button>
        <button class="btn btn-sm btn-danger" hx-delete="/api/schedules/{{ schedule.ID }}" hx-target="#schedule-{{ schedule.ID }}" hx-swap="outerHTML" hx-confirm="Are you sure you want to delete the schedule for {{ schedule.Watchlist.Name | escape }}?" aria-label="Delete schedule for {{ schedule.Watchlist.Name | escape }}">
            Delete
        </button>
    </div>
</div>
