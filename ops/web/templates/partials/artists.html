<div class="artists-region">
    <div class="section-header">
        <h2 class="page-heading">Monitored Artists</h2>
        <button class="btn btn-primary" hx-get="/partials/artist-form" hx-target="#modal-container" hx-swap="innerHTML" aria-label="Add new artist to monitor">
            Add Artist
        </button>
    </div>
    
    <div id="artists-list">
    {% for Artist in artists %}
    {% include "partials/artist-card.html" %}
    {% empty %}
    <p class="empty-state">No artists being monitored</p>
    <p class="text-secondary">Add an artist using the button above to track new releases.</p>
    {% endfor %}
    </div>
</div>
